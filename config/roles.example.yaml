      - テストを先に書き、赤を確認してから実装する（バグ修正の場合）。
      - 作業の区切りで commit する（メッセージは repo の規約に従う）。push はしない。
  plan-reviewer-claude-opus:
    harness: claude
    fallback: plan-reviewer
    model: opus
    thinking: medium
