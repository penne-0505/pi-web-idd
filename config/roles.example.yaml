      - 既存コードの事実は現物で確かめてから書く。推測は「推測」と明示する。
  executor-claude-opus:
    harness: claude
    fallback: executor
    model: opus
    thinking: high
    report: exec
    require_clean: false
    budget_minutes: 90
    policy:
